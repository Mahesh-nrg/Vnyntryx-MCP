[project]
name = "vyntryx-mcp"
version = "0.1.0"
description = "Local MCP connector: scan source code with Vyntryx (SAST) from Claude Code, Codex or VS Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved (see LICENSE)" }
dependencies = [
    "mcp>=2.3,<3",          # official MCP Python SDK (v2 serves the 2026-07-28 and 2025 protocol revisions over stdio)
    "httpx>=0.27",
    "cryptography>=42",     # ES256 DPoP proofs
    "keyring>=25",          # OS keyring for the refresh token + DPoP key
    "pathspec>=0.12",       # .gitignore semantics when packaging source
]

[project.scripts]
vyntryx-mcp = "vyntryx_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyntryx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
